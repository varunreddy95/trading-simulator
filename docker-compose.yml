services:
  papertrading-db:
    image: postgres:latest
    container_name: papertrading-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: papertrading
    ports:
      - "5433:5432"  # Expose on host 5433
    volumes:
      - trading-simulator_pgdata:/var/lib/postgresql/data

volumes:
  trading-simulator_pgdata:
